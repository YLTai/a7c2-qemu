name: QEMU build and firmware-free smoke
on:
  workflow_dispatch:
    inputs:
      firmware:
        description: Run real firmware import and headless smoke
        type: boolean
        default: false
      fl23_only:
        description: FL23 diagnostic iteration only (final validation must use false)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: qemu-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install official build dependencies
        run: |
          sudo apt-get update
          mapfile -t packages < tools/ci/dependencies.txt
          sudo apt-get install -y "${packages[@]}"
          echo '/usr/bin' >> "$GITHUB_PATH"
          echo '/usr/sbin' >> "$GITHUB_PATH"
      - name: Load reviewed distribution bwrap profile
        shell: bash
        run: |
          set -euo pipefail
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          test "$(sysctl -n kernel.unprivileged_userns_clone)" = 1
          test ! -e /etc/apparmor.d/bwrap-userns-restrict
          test ! -s /etc/apparmor.d/local/bwrap-userns-restrict
          test ! -s /etc/apparmor.d/local/unpriv_bwrap
          review_dir=$(mktemp -d "$RUNNER_TEMP/bwrap-profile.XXXXXX")
          cd "$review_dir"
          curl --fail --location --retry 3 'https://archive.ubuntu.com/ubuntu/pool/main/a/apparmor/apparmor-profiles_4.0.1really4.0.1-0ubuntu0.24.04.9_all.deb' -o profile.deb
          echo '90b02aa006eea7702cd4e851343e469e41365dda42145a3cb035de1d6c773b8c  profile.deb' | sha256sum --check
          dpkg-deb --extract profile.deb extracted
          profile=extracted/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          echo "11d39094f044f0cda0febb3ad517b830301da6b2ce929664af09ee9e4dd264f9  $profile" | sha256sum --check
          sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          test "$(sysctl -n kernel.unprivileged_userns_clone)" = 1
      - name: Check dependencies and namespace support
        run: |
          set -o pipefail
          mkdir -p ci-logs
          bash tools/check-host.sh 2>&1 | tee ci-logs/host.log
          bwrap --unshare-all --die-with-parent --ro-bind / / --dev /dev --proc /proc /bin/true 2>&1 | tee ci-logs/namespace.log
      - name: Compute exact identities
        id: identity
        run: python3 tools/ci/qemu-cache.py key >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: source-cache
        with:
          path: source/vendor/qemu-11.1.2.tar.xz
          key: qemu-source-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.source_sha }}
      - name: Download missing source and verify all patches
        run: |
          set -o pipefail
          archive=source/vendor/qemu-11.1.2.tar.xz
          if ! test -f "$archive"; then
            curl --fail --location --retry 3 https://download.qemu.org/qemu-11.1.2.tar.xz -o "$archive.part"
            mv "$archive.part" "$archive"
          fi
          python3 tools/check-source.py 2>&1 | tee ci-logs/source.log
      - uses: actions/cache/save@v4
        if: steps.source-cache.outputs.cache-hit != 'true'
        with:
          path: source/vendor/qemu-11.1.2.tar.xz
          key: qemu-source-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.source_sha }}
      - uses: actions/cache/restore@v4
        id: build-cache
        with:
          key: qemu-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.build_key }}
          path: |
            runtime/sources/qemu-11.1.2/build-sony-ui/qemu-system-aarch64
            runtime/sources/qemu-11.1.2/build-user/qemu-aarch64
            runtime/sources/qemu-tools/usr/lib/libfdt.so.1
            runtime/sources/qemu-tools/usr/bin/dtc
            runtime/analysis/qemu-virt-board/virt-packed.dtb
            source/pci-hardware-build.json
            source/build-programs.sha256
            source/ci-build-receipt.json
      - name: Validate cache or build from pinned source
        run: |
          set -o pipefail
          if python3 tools/ci/qemu-cache.py verify > ci-logs/cache.log 2>&1; then
            cat ci-logs/cache.log
          else
            cat ci-logs/cache.log
            bash build-qemu.sh 2>&1 | tee ci-logs/build.log
            python3 tools/ci/qemu-cache.py seal
            python3 tools/ci/qemu-cache.py verify
          fi
      - name: Verify versions, machine, and synthetic QMP input
        run: |
          set -o pipefail
          bash tools/ci/qemu-smoke.sh 2>&1 | tee ci-logs/smoke.log
      - uses: actions/cache/save@v4
        if: success() && steps.build-cache.outputs.cache-hit != 'true'
        with:
          key: qemu-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.build_key }}
          path: |
            runtime/sources/qemu-11.1.2/build-sony-ui/qemu-system-aarch64
            runtime/sources/qemu-11.1.2/build-user/qemu-aarch64
            runtime/sources/qemu-tools/usr/lib/libfdt.so.1
            runtime/sources/qemu-tools/usr/bin/dtc
            runtime/analysis/qemu-virt-board/virt-packed.dtb
            source/pci-hardware-build.json
            source/build-programs.sha256
            source/ci-build-receipt.json
      - name: Verify full launcher without firmware
        timeout-minutes: 2
        run: python3 tools/ci/qemu-launcher-preflight.py
      - name: Verify FL23 preflight and transaction failures without firmware
        run: |
          python3 -m unittest discover -s runtime/analysis -p test_fl23_preflight.py -v
          python3 -m unittest discover -s runtime/analysis -p test_fl23_sha256.py -v
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tools/ci/test-fl23-menu-transaction.c -o "$RUNNER_TEMP/fl23-transaction-test"
          "$RUNNER_TEMP/fl23-transaction-test"
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tools/ci/test-fl23-menu-guest.c -o "$RUNNER_TEMP/fl23-guest-test"
          "$RUNNER_TEMP/fl23-guest-test"
      - name: Install guest helper cross compiler
        run: |
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version
          aarch64-linux-gnu-ld --version
      - name: Verify offline no-op library and uncertain execution handling
        timeout-minutes: 3
        run: bash tools/ci/usb-noop-smoke.sh
      - name: Download private firmware input
        if: github.event_name == 'workflow_dispatch' && inputs.firmware
        env:
          SONY_FIRMWARE_URL: ${{ secrets.SONY_FIRMWARE_URL }}
        run: python3 tools/ci/download-firmware.py
      - name: Verify and import pinned Sony firmware
        if: github.event_name == 'workflow_dispatch' && inputs.firmware
        run: |
          set -o pipefail
          bash start.sh --bodydata "$RUNNER_TEMP/sony-private-input/BODYDATA.DAT" --prepare-only 2>&1 | tee ci-logs/firmware-prepare.log
      - name: Verify FL23 original ELF identity and menu data mappings
        if: github.event_name == 'workflow_dispatch' && inputs.firmware
        env:
          MENU_BACKUP_SAVE: '0'
          A7C2_SETTINGS_PERSIST: '0'
        run: python3 runtime/analysis/fl23_preflight.py runtime/analysis/menu-root/usr/lib/appFw.so
      - name: Real headless firmware boot and screenshot
        if: github.event_name == 'workflow_dispatch' && inputs.firmware && !inputs.fl23_only
        timeout-minutes: 20
        env:
          A7C2_SPARSE_RAM: '1'
        run: python3 tools/ci/firmware-headless-smoke.py
      - name: Verify bytecode interpreter and display parser logic
        if: github.event_name == 'workflow_dispatch' && inputs.firmware && !inputs.fl23_only
        run: |
          python3 runtime/analysis/build-ram-bytecode.py "$RUNNER_TEMP/bytecode-fixtures"
          cc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tools/ci/test-ram-bytecode.c -o "$RUNNER_TEMP/ram-bytecode-test"
          "$RUNNER_TEMP/ram-bytecode-test" "$RUNNER_TEMP/bytecode-fixtures"
          cc -O2 -Wall -Wextra -Werror runtime/analysis/test-ramfb-viewer.c -o "$RUNNER_TEMP/ramfb-unit-test"
          "$RUNNER_TEMP/ramfb-unit-test"
      - name: Real guest RAM plugin and recovery tests
        if: github.event_name == 'workflow_dispatch' && inputs.firmware && !inputs.fl23_only
        timeout-minutes: 30
        env:
          A7C2_SPARSE_RAM: '1'
        run: python3 tools/ci/ram-plugin-smoke.py
      - name: Real guest FL23 volatile menu tests
        if: github.event_name == 'workflow_dispatch' && inputs.firmware
        timeout-minutes: 35
        env:
          A7C2_SPARSE_RAM: '1'
          A7C2_FL23_DISCOVERY: ${{ inputs.fl23_only && '1' || '0' }}
        run: python3 tools/ci/fl23-menu-smoke.py
      - name: Upload only real screenshot and result
        uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.firmware
        with:
          name: firmware-boot-evidence
          path: |
            ci-firmware-evidence/result.json
            ci-firmware-evidence/firmware-screen.png
            ci-firmware-evidence/plugin-result.json
            ci-firmware-evidence/plugin-*.png
            ci-firmware-evidence/fl23-result.json
            ci-firmware-evidence/fl23-*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload only build verification logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-build-logs
          path: |
            ci-logs/*.log
            ci-logs/build-identity.json
            ci-logs/usb-noop-result.json
            source/ci-build-receipt.json
            source/build-programs.sha256
          retention-days: 7
          if-no-files-found: ignore
